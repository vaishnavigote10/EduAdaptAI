databases:
  - name: eduadapt-db
    plan: free
    databaseName: eduadapt
    user: eduadapt

services:
  - type: web
    name: eduadapt
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn eduadapt.wsgi:application --workers 1 --threads 4 --timeout 120
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: eduadapt-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: LLM_API_KEY
        sync: false
